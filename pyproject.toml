[project]
name = "jev-benchmark"
version = "0.1.0"
description = "Jev (TypeSafe AI) vs LLM generativo su Microsoft Foundry: benchmark di classificazione in tre scenari"
authors = [{ name = "Andrea D'Amicis", email = "a.damicis@reply.it" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai (>=2.0,<3.0)",
    "typesafe-sdk (>=0.7,<1.0)",
    "pydantic (>=2.8,<3.0)",
    "pydantic-settings (>=2.4,<3.0)",
    "httpx (>=0.27,<1.0)",
    "pandas (>=2.2,<3.0)",
    "numpy (>=1.26,<3.0)",
    "scikit-learn (>=1.5,<2.0)",
    "scipy (>=1.13,<2.0)",
    "matplotlib (>=3.9,<4.0)",
    "typer (>=0.12,<1.0)",
    "rich (>=13.7,<15.0)",
    "tiktoken (>=0.8,<1.0)",
]

[project.scripts]
jevbench = "jev_benchmark.cli:app"

[tool.poetry]
packages = [{ include = "jev_benchmark", from = "src" }]

[tool.poetry.group.demo.dependencies]
streamlit = "^1.40"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# label taxonomy table and report prose: one sentence per line is easier to review
"src/jev_benchmark/tasks/intent_routing.py" = ["E501"]
"src/jev_benchmark/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
